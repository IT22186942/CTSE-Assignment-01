name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - contract-service
          - payment-service
          - notification-service
          - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ${{ matrix.service }}

      - name: Build frontend
        if: matrix.service == 'frontend'
        run: npm run build
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: install-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t smart-mall-user-service ./user-service
          docker build -t smart-mall-contract-service ./contract-service
          docker build -t smart-mall-payment-service ./payment-service
          docker build -t smart-mall-notification-service ./notification-service
          docker build -t smart-mall-frontend ./frontend

      - name: Optional push reminder
        run: echo "Add docker login and docker push steps if you want registry publishing."
