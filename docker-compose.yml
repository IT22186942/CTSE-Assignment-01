version: '3.8'

services:
  
  # Auth Service
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=your-super-secret-key-change-this-in-production
      - NODE_ENV=development
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Request Service
  request-service:
    build: ./request-service
    container_name: request-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - JWT_SECRET=your-super-secret-key-change-this-in-production
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://auth-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - LOGGING_SERVICE_URL=http://logging-service:3004
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Notification Service
  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=development
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Logging Service
  logging-service:
    build: ./logging-service
    container_name: logging-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=development
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  campus-network:
    driver: bridge
