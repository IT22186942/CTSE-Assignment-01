services:
  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      PORT: 3001
      JWT_SECRET: super-secret-jwt
      SERVICE_TOKEN: internal-service-token
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  contract-service:
    build: ./contract-service
    container_name: contract-service
    environment:
      PORT: 3002
      JWT_SECRET: super-secret-jwt
      SERVICE_TOKEN: internal-service-token
      USER_SERVICE_URL: http://user-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on:
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment-service:
    build: ./payment-service
    container_name: payment-service
    environment:
      PORT: 3003
      JWT_SECRET: super-secret-jwt
      SERVICE_TOKEN: internal-service-token
      CONTRACT_SERVICE_URL: http://contract-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on:
      contract-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      PORT: 3004
      JWT_SECRET: super-secret-jwt
      SERVICE_TOKEN: internal-service-token
    ports:
      - "3004:3004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      user-service:
        condition: service_healthy
      contract-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "5173:80"
